<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>穿山甲策略步道｜Pangolin Strategy Trail</title>
<meta name="description" content="跟著穿山甲洛洛，沿著虛構山城「穿山甲大學」的台地步道，走完一學期的國際策略管理。">
<style>
:root{
  --forest:#004030; --sand:#D8C3A5; --cream:#fbf8f1; --ink:#1f2421;
  --magpie:#2f6db5; --beak:#c8432f; --pangolin:#8a5a3b; --leaf:#9cc27a; --sun:#f2d36b;
  --glass:rgba(251,248,241,.78); --shadow:0 1px 2px rgba(31,36,33,.08),0 6px 18px rgba(31,36,33,.10);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% 30%,#f7f4ec,#dfe6d6);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#app canvas{display:block;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}

/* 品牌卡 */
#brand{position:fixed;top:16px;left:16px;padding:12px 16px 12px 14px;border-radius:18px;background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;z-index:5}
#brand .mark{width:38px;height:38px;border-radius:12px;background:var(--forest);display:grid;place-items:center;flex:none}
#brand h1{margin:0;font-size:18px;letter-spacing:1px;color:var(--forest);font-weight:800;line-height:1.2}
#brand p{margin:2px 0 0;font-size:11px;color:#5b6359;letter-spacing:.5px}
#langBtn{margin-left:6px;min-width:44px;min-height:44px;border-radius:9px;border:1px solid rgba(0,64,48,.18);background:#fff;color:var(--forest);font:700 12px var(--font);cursor:pointer}

/* 左上工具 */
#tools{position:fixed;top:88px;left:16px;display:flex;gap:8px;z-index:5}

/* HUD */
#hud{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);z-index:5;
  width:max-content;max-width:calc(100vw - 24px);flex-wrap:nowrap}
#presetBtns{display:flex;gap:2px}
#hud .btn{white-space:nowrap}
@media (max-width:1100px){ #hud .btn{padding:0 9px} #hud .sep{margin:0 2px} }
#clock{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--forest);padding:0 12px 0 14px;min-width:72px;text-align:center;letter-spacing:1px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--ink);font:600 13px var(--font);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.btn:hover{background:var(--sun)}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn:focus-visible,#langBtn:focus-visible,.zone-label:focus-visible{outline:3px solid var(--beak);outline-offset:2px}
.btn.solid{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border-radius:12px}
.btn.solid:hover{background:var(--sun)}
.btn.solid[aria-pressed="true"]{background:var(--ink);color:#fff}
#authBtn[aria-pressed="true"]{background:var(--forest);color:#fff}
.sep{width:1px;height:24px;background:rgba(31,36,33,.14)}

/* 區塊木牌標籤 */
.zone-label{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;
  background:var(--cream);border:2px solid var(--pangolin);box-shadow:0 2px 8px rgba(74,42,20,.18);font:700 13px var(--font);color:var(--ink);
  white-space:nowrap;transition:opacity .2s,background .2s,color .2s;user-select:none}
.zone-label .code{font:700 10px ui-monospace,Consolas,monospace;letter-spacing:1px;background:var(--forest);color:var(--sand);padding:3px 6px;border-radius:999px}
.zone-label:hover{background:var(--sun)}
.zone-label.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.zone-label.active .code{background:var(--sand);color:var(--forest)}
.zone-label.dim{opacity:.45}

/* 概念線圖例、保育提醒、角色名牌 */
#legend{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));padding:10px 14px;border-radius:14px;background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);z-index:5;font-size:12px}
#legend[hidden]{display:none}
#legend .lg-title{font:700 10px ui-monospace,Consolas,monospace;letter-spacing:2px;color:#5b6359;margin-bottom:6px;text-transform:uppercase}
#legend .lg-row{display:flex;align-items:center;gap:8px;margin-top:4px}
#notice{position:fixed;top:16px;right:16px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(31,47,64,.78);
  color:#f4f1e8;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:5;opacity:0;transform:translateY(-6px);transition:opacity .8s,transform .8s;pointer-events:none}
#notice.show{opacity:1;transform:none}
.walker-tag{pointer-events:none;padding:3px 8px;border-radius:999px;background:rgba(251,248,241,.92);border:1px solid rgba(0,64,48,.18);
  font:600 11px var(--font);color:var(--ink);white-space:nowrap;box-shadow:0 2px 6px rgba(31,36,33,.12);transform:translateY(-6px)}
.walker-tag.lolo{border-color:#c8463c;border-width:1.5px}

/* ---------- 面板共用 ---------- */
.panel{background:var(--cream);border-radius:22px;box-shadow:0 1px 2px rgba(31,36,33,.06),0 8px 24px rgba(31,36,33,.10),0 24px 60px rgba(31,36,33,.08);z-index:8}
.panel[hidden],#gate[hidden]{display:none!important}
.eyebrow{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;color:#6a7368;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.muted{color:#5b6359;font-size:13px;line-height:1.6}
.close-x{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;border-radius:12px;background:transparent;font-size:24px;line-height:1;color:#5b6359;cursor:pointer}
.close-x:hover{background:var(--sun)}
.close-x:focus-visible,.tab:focus-visible,.chip:focus-visible,.li-btn:focus-visible,.vid:focus-visible,#searchBox:focus-visible,#diaryFilter:focus-visible,#gate input:focus-visible{outline:3px solid var(--beak);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;border:0;background:#fff;color:var(--ink);font:600 12px var(--font);
  box-shadow:0 2px 8px rgba(74,42,20,.08);cursor:pointer;text-align:left}
.chip:hover{background:var(--sun)}
.chip .sw{width:18px;height:4px;border-radius:2px;background:var(--beak);flex:none}
.chip .sw.concept{background:repeating-linear-gradient(90deg,var(--beak) 0 5px,transparent 5px 8px)}
.chip .sw.extend{background:repeating-linear-gradient(90deg,var(--beak) 0 3px,transparent 3px 7px)}
.btn.primary{background:var(--forest);color:#fff}
.btn.primary:hover{background:#00563f;color:#fff}
.btn.ghost{background:#fff;border:1px solid rgba(31,36,33,.12)}

#account{position:fixed;top:16px;right:16px;z-index:6;display:flex;gap:8px;align-items:center}
#notice{top:16px;right:auto;left:50%;transform:translate(-50%,-6px)}
#notice.show{transform:translate(-50%,0)}

/* ---------- 左側詳細卡片 ---------- */
#card{position:fixed;left:16px;top:144px;width:340px;max-height:calc(100vh - 144px - 96px);overflow:auto;padding:22px 20px 20px}
#card h2{margin:6px 44px 6px 0;font-size:20px;line-height:1.35;color:var(--forest)}
#card .tagline{margin:8px 0 12px;padding:10px 12px;border-radius:14px;background:#f1ece0;font-size:13px;line-height:1.6;color:#4a3f33}
#card .tagline b{color:var(--pangolin)}
#card .sec{margin-top:16px}
#card .sec-title{font:700 10px ui-monospace,Consolas,monospace;letter-spacing:2px;color:#6a7368;text-transform:uppercase;margin-bottom:8px}
#card .chips{display:flex;flex-wrap:wrap;gap:6px}
#card .thumb{display:block;width:160px;height:160px;margin:10px auto 6px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#fff,#ece5d6)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:#fff;border-radius:14px;padding:10px 8px;box-shadow:0 2px 8px rgba(74,42,20,.06);min-width:0}
.tile .num{font:italic 700 17px/1.15 Georgia,"Times New Roman",serif;color:var(--forest);overflow-wrap:anywhere}
.tile .cap{margin-top:4px;font-size:11px;line-height:1.4;color:#5b6359;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pts{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.pts li{margin:4px 0}
.li-btn{display:flex;width:100%;gap:8px;align-items:flex-start;padding:8px 10px;border:0;border-radius:12px;background:transparent;font:500 13px var(--font);color:var(--ink);text-align:left;cursor:pointer;min-height:44px}
.li-btn:hover{background:#f1ece0}
.li-btn .no{flex:none;width:22px;height:22px;border-radius:50%;background:var(--forest);color:var(--sand);font:700 11px ui-monospace,Consolas,monospace;display:grid;place-items:center;margin-top:1px}
.li-btn .sub{display:block;font-size:11px;color:#6a7368;margin-top:2px}
.unit{display:flex;gap:8px;flex-wrap:wrap}
.unit a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:9px;background:var(--forest);color:#fff;text-decoration:none;font:600 13px var(--font)}
.unit a:hover{background:#00563f}
.unit a:focus-visible{outline:3px solid var(--beak);outline-offset:2px}
.locked{padding:10px 12px;border-radius:12px;background:#f4efe3;font-size:12px;color:#5b6359;line-height:1.6}
.meta{font-size:12px;color:#6a7368;margin-top:10px}
/* 影片預覽卡 */
.vid{display:block;width:100%;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:pointer;background:#123a2f;margin-bottom:8px;position:relative}
.vid canvas{display:block;width:100%;height:auto}
.vid-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin-bottom:6px;background:#000}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-note{font-size:11px;color:#6a7368;margin:-2px 0 8px}
.vid-note a{color:var(--forest)}

/* ---------- 右側清單側欄 ---------- */
#sidebar{position:fixed;right:16px;top:76px;bottom:96px;width:318px;display:flex;flex-direction:column;padding:14px;background:rgba(251,248,241,.86);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sb-head{position:relative;padding-right:48px}
.sb-head .close-x{top:0;right:0}
#searchBox{width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(31,36,33,.14);background:#fff;font:500 14px var(--font);color:var(--ink)}
.tabs{display:flex;gap:6px;margin:10px 0 6px}
.tab{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font:700 13px var(--font);color:#5b6359;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:hover:not([aria-selected="true"]){background:var(--sun)}
#sbList{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
#sbList details{border-radius:14px;margin:6px 0;background:#fff;box-shadow:0 2px 8px rgba(74,42,20,.06)}
#sbList summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:44px;font-weight:700;font-size:14px;color:var(--forest)}
#sbList summary::-webkit-details-marker{display:none}
#sbList summary .code{font:700 10px ui-monospace,Consolas,monospace;background:var(--forest);color:var(--sand);padding:3px 6px;border-radius:999px}
#sbList summary .wk{margin-left:auto;font:600 11px var(--font);color:#6a7368}
#sbList .inner{padding:0 6px 8px}
#sbList .empty{padding:16px;text-align:center;color:#6a7368;font-size:13px}
#resumeWrap .btn{width:100%;margin:4px 0 2px;background:var(--sun)}

/* ---------- 步道日記 ---------- */
#diary{position:fixed;right:16px;top:76px;width:300px;max-height:46vh;display:flex;flex-direction:column;padding:14px 14px 10px}
body.sidebar-open #diary,body.sidebar-open #legend{right:350px}
.dy-head{position:relative;display:flex;flex-direction:column;gap:2px;padding-right:44px}
.dy-head strong{font-size:15px;color:var(--forest)}
.dy-head .close-x{top:-4px;right:-4px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#2fb36b;box-shadow:0 0 0 3px rgba(47,179,107,.2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
#diaryFilter{margin:8px 0 6px;min-height:40px;border-radius:10px;border:1px solid rgba(31,36,33,.14);background:#fff;font:500 13px var(--font);padding:0 8px;color:var(--ink)}
.dy-opt{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a4f49;margin:0 0 6px;min-height:32px;cursor:pointer}
.dy-opt input{width:18px;height:18px;accent-color:var(--forest)}
#diaryList{list-style:none;margin:0;padding:0;overflow:auto;font-size:12px;line-height:1.5}
#diaryList li{padding:7px 4px;border-top:1px solid rgba(31,36,33,.07);display:flex;gap:8px}
#diaryList time{font:600 11px ui-monospace,Consolas,monospace;color:#6a7368;flex:none;padding-top:1px}
#diaryList .tag{flex:none;font:700 10px var(--font);padding:1px 6px;border-radius:999px;background:#e7f2ea;color:#1d6b43;height:fit-content}
#diaryList .tag.arrive{background:#fbeedd;color:#8a5a3b}
#diaryList .empty{color:#6a7368;border:0}

/* ---------- 學生入口閘門 ---------- */
#gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(20,32,26,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
#gateForm{width:min(380px,100%);padding:24px 22px 20px;position:relative}
#gateForm h2{margin:6px 0 4px;color:var(--forest)}
#gateForm label{display:block;margin-top:12px;font-size:12px;font-weight:700;color:#4a4f49}
#gateForm input{display:block;width:100%;margin-top:6px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid rgba(31,36,33,.16);background:#fff;font:500 15px var(--font);color:var(--ink)}
#gateForm .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#gateForm .err{min-height:18px;margin-top:10px;color:#a0331f;font-size:12px;font-weight:600}

/* ---------- 細項 pin ---------- */
.pin{pointer-events:auto;cursor:pointer;width:24px;height:24px;border-radius:50%;background:var(--forest);color:var(--sand);border:2px solid #fff;
  font:700 11px ui-monospace,Consolas,monospace;display:grid;place-items:center;box-shadow:0 2px 6px rgba(31,36,33,.25)}
.pin:hover,.pin.active{background:var(--beak);color:#fff}
.zone-label.occluded,.pin.occluded{visibility:hidden}
.zone-label.code-only .name{display:none}

/* ---------- M5：導覽、說明、頁尾、手機 HUD、底部面板 ---------- */
#hudExtra{display:contents}
#timeBtn{display:none}
#tour{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));padding:14px 18px 12px;z-index:9}
#tour p{margin:6px 0 10px;font-size:15px;line-height:1.6;color:var(--ink)}
#tour .eyebrow{justify-content:space-between}
.tour-bar{height:4px;border-radius:2px;background:#e6dfcf;overflow:hidden}
.tour-bar span{display:block;height:100%;width:0;background:var(--forest);transition:width .2s linear}
.tour-ctl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tour-ctl #tourEnd{margin-left:auto}
body.touring #card{max-height:calc(100vh - 144px - 250px)}
#help{position:fixed;inset:0;z-index:28;display:grid;place-items:center;background:rgba(20,32,26,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
#help[hidden]{display:none}
.help-tabs{margin:8px 0 4px}
.help-pane[hidden]{display:none}
.gloss{margin:10px 0 0}
.gloss dt{font-weight:700;color:var(--forest);margin-top:12px;font-size:14px}
.gloss dd{margin:4px 0 0;font-size:13px;line-height:1.65;color:#3f463f}
.gl-lines{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:12px}
.gl-lines>span{display:inline-flex;align-items:center;gap:6px}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-top:8px}
.icon-grid .ic{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 8px;font-size:12px;line-height:1.4;box-shadow:0 2px 8px rgba(74,42,20,.06)}
.icon-grid canvas{width:36px;height:36px;flex:none}
.cast-roles{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:#f1ece0;font-size:13px;line-height:1.65}
.cast-roles b{display:block;color:var(--forest)}
#castList{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.cast-card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(74,42,20,.06);font-size:12px;line-height:1.55;scroll-margin:12px}
.cast-card.lolo{grid-column:1/-1;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.cast-card canvas{display:block;width:120px;height:120px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#fff,#ece5d6);margin:0 auto 8px}
.cast-card.lolo canvas{margin:0}
.cast-card h3{margin:0;font-size:15px;color:var(--forest)}
.cast-card .en-name{font-size:11px;color:#6a7368;margin-bottom:6px}
.cast-card .k{display:block;font:700 9px ui-monospace,Consolas,monospace;letter-spacing:1.5px;color:#6a7368;text-transform:uppercase;margin-top:6px}
.cast-card.flash{outline:3px solid var(--sun)}
.help-box{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px 22px 20px;position:relative}
.help-box h2{margin:6px 44px 6px 0;color:var(--forest)}
.lang-pick{display:inline-flex;gap:4px;margin:10px 0 2px;padding:4px;border-radius:12px;background:#efe9dc}
.lang-pick .btn{min-height:40px;padding:0 16px;border-radius:9px;font-size:14px}
.lang-pick .btn[aria-pressed="true"]{background:var(--forest);color:#fff}
.help-steps{margin:14px 0 6px;padding:0;list-style:none;counter-reset:s}
.help-steps li{counter-increment:s;position:relative;padding:10px 12px 10px 48px;margin:8px 0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(74,42,20,.06);font-size:13px;line-height:1.6}
.help-steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--forest);color:var(--sand);font:700 12px ui-monospace,Consolas,monospace;display:grid;place-items:center}
.help-steps b{display:block;color:var(--forest)}
.help-box .credit{font-size:11px;color:#6a7368;line-height:1.6;margin:12px 0 0}
.help-box .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#credit{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:280px;font-size:10px;line-height:1.5;color:#3f463f;z-index:4;pointer-events:none;
  padding:6px 10px;border-radius:10px;background:rgba(251,248,241,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (max-width:1279px){#credit{display:none}}
#demoHint{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(31,36,33,.72);color:#fff;font-size:12px;z-index:9;transition:opacity 1s}
#demoHint[hidden]{display:none}
#rmNote{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:min(520px,calc(100vw - 32px));padding:9px 14px;border-radius:14px;background:rgba(31,36,33,.82);color:#fff;font-size:12px;line-height:1.6;z-index:9}
#rmNote[hidden]{display:none}
.help-box .rm-help{font-size:12px;margin:10px 0 0}
.help-box .demo-links{font-size:11px;color:#6a7368;margin:8px 0 0}
.help-box .demo-links a{color:var(--forest);font-weight:700;text-decoration:none;padding:2px 2px}
.help-box .demo-links a:hover{text-decoration:underline}
.en-sub{display:block;font-size:.82em;font-weight:500;color:#5b6359;margin-top:2px;line-height:1.45}
.zone-label .en{font-weight:500;font-size:11px;color:#5b6359}
.zone-label.active .en{color:#d8e6dd}
#tour .en-sub{font-size:13px}
.sheet-handle{display:none}
body.demo #account{display:none}

/* 載入畫面 */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#f7f4ec,#dfe6d6);z-index:20;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#loading .box{text-align:center;padding:24px;max-width:560px}
#loading .t{font-size:clamp(28px,6vw,46px);font-weight:800;color:var(--forest);letter-spacing:3px}
#loading .s{margin-top:12px;font-size:15px;color:#5b6359}
#loading .err{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff3ef;color:#8a2a17;font-size:13px;text-align:left;white-space:pre-wrap;display:none}

@media (max-width:800px){
  #brand{top:12px;left:12px;right:12px;padding:10px 12px}
  #brand h1{font-size:16px}
  #langBtn{margin-left:auto}
  #tools{top:84px;left:12px;flex-direction:column}
  #hud{bottom:calc(12px + env(safe-area-inset-bottom));gap:2px}
  #hud{flex-wrap:wrap;justify-content:center;border-radius:22px;width:auto;max-width:calc(100vw - 24px)}
  #timeBtn{display:inline-flex}
  #hudExtra{display:none}
  #hud.expanded{width:calc(100vw - 24px)}
  #hud.expanded #hudExtra{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:100%}
  #tour{bottom:calc(76px + env(safe-area-inset-bottom))}
  #tour p{font-size:14px}
  .sheet-handle{display:block;position:sticky;top:-18px;margin:-10px auto 6px;width:100%;height:24px;cursor:ns-resize;touch-action:none;z-index:2}
  .sheet-handle::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:rgba(31,36,33,.22);margin:9px auto 0}
  #hud .btn{padding:0 7px;font-size:12px;min-width:40px}
  #hud .sep{display:none}
  #account{top:84px;right:12px}
  #tools{flex-direction:row}
  #card,#sidebar{left:0;right:0;bottom:0;top:auto;width:auto;border-radius:22px 22px 0 0;z-index:12}
  #card{height:34vh;max-height:none;padding:18px 16px 16px}
  #sidebar{height:52vh}
  #diary{left:12px;right:12px;top:140px;width:auto;max-height:38vh}
  body.sidebar-open #diary{right:12px}
  #legend{right:12px;bottom:calc(132px + env(safe-area-inset-bottom))}
  body.sidebar-open #legend{right:12px}
  #notice{top:auto;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));font-size:12px}
  #clock{min-width:52px;padding:0 4px 0 8px;font-size:13px}
  .zone-label{font-size:12px;padding:4px 9px 4px 5px}
}
/* 鏡頭拉遠且畫面窄時，標籤只留代碼，避免互相重疊（完整避讓在 M3 實作） */
body.compact-labels .zone-label{padding:4px}
body.compact-labels .zone-label .name{display:none}
body.reduce-motion #loading,body.reduce-motion .zone-label,body.reduce-motion #notice,body.reduce-motion .btn,body.reduce-motion .chip,body.reduce-motion .tour-bar span{transition:none!important}
body.reduce-motion .live-dot{animation:none}
@media (prefers-reduced-motion:reduce){
  #loading,.zone-label,#notice,.btn,.chip,.tour-bar span,#demoHint{transition:none!important}
  .live-dot{animation:none}
}

const qs = new URLSearchParams(location.search);
// 語言：網址參數 > 上次的選擇 > 瀏覽器語言（中文瀏覽器預設中文，其他預設英文）
function initialLang() {
  const q = qs.get("lang");
  if (q === "en" || q === "zh") return q;
  if (q === "both") return "zh";
  try { const s = JSON.parse(localStorage.getItem("pst.lang")); if (s === "en" || s === "zh") return s; } catch { /* 忽略 */ }
  return /^zh/i.test(navigator.language || "") ? "zh" : "en";
}
let lang = initialLang();
let bilingual = qs.get("lang") === "both"; // 中英並列（簡報用）：中文為主，英文在下方
const enSub = (o) => (bilingual && o && o.en ? o.en : "");
const tr = (k) => DATA.i18n[lang][k] ?? DATA.i18n.zh[k] ?? k;
const pick = (o) => (o && (o[lang] ?? o.zh)) || "";

function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function showError(err) {
  console.error(err);
  const box = document.getElementById("loadingErr");
  document.getElementById("loadingMsg").textContent = tr("errTitle");
  box.textContent = String(err && (err.stack || err.message) || err);
  box.style.display = "block";
  document.getElementById("loading").classList.remove("hide");
}

function applyStaticI18n() {
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant-TW";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", tr(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach((el) => el.setAttribute("title", tr(el.dataset.i18nTitle)));
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.setAttribute("placeholder", tr(el.dataset.i18nPh)));
  document.getElementById("langBtn").textContent = tr("lang");
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("app").setAttribute("aria-label", tr("sceneLabel"));
  document.getElementById("hud").setAttribute("aria-label", tr("hudLabel"));
  document.title = `${pick(DATA.meta.title)}｜${lang === "en" ? "穿山甲策略步道" : "Pangolin Strategy Trail"}`;
}
applyStaticI18n();

/* ============================================================
   主程式
   ============================================================ */
try {
  const THREE = await import("three");
  const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
  const { CSS2DRenderer, CSS2DObject } = await import("three/addons/renderers/CSS2DRenderer.js");
  const { SimplexNoise } = await import("three/addons/math/SimplexNoise.js");
  const { RoundedBoxGeometry } = await import("three/addons/geometries/RoundedBoxGeometry.js");
  const BufferGeometryUtils = await import("three/addons/utils/BufferGeometryUtils.js");

  const rng = mulberry32(20261025);
  const simplex = new SimplexNoise({ random: rng });
  const isMobile = () => window.innerWidth <= 800;
  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  const forceReduce = qs.get("motion") === "reduce"; // ?motion=reduce：在任何裝置上預覽「減少動態效果」
  let reducedMotion = motionQuery.matches || forceReduce;
  let dirty = true; // 需要重新繪製

  /* ---------- Renderer / Scene / Camera ---------- */
  const app = document.getElementById("app");
  const probe = document.createElement("canvas");
  if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) throw new Error("WebGL is not available in this browser.");

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile() ? 1.4 : 1.75));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  app.appendChild(renderer.domElement);

  const labelRenderer = new CSS2DRenderer({ element: document.getElementById("labels") });

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xeef0e2, 62, 170);

  const camera = new THREE.PerspectiveCamera(32, 1, 0.3, 320);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = 3;
  controls.maxDistance = 70;

  /* ---------- 地形高度函式 ---------- */
  // 台地頂面依序升高，每層約 0.36
  const tierTop = (i) => 0.5 + i * 0.36;
  // 基礎山坡：朝鏡頭（+z）緩降，外圍隆起成環山；鏡頭那一側壓低，避免擋住步道
  function baseHill(x, z) {
    const slope = THREE.MathUtils.clamp((11.5 - z) * 0.16, -0.4, 3.4);
    const n = simplex.noise(x * 0.08, z * 0.08) * 0.22 + simplex.noise(x * 0.27, z * 0.27) * 0.05;
    const r = Math.hypot(x - 0.5, z - 2);
    const rim = smoothstep(17, 40, r) * (7 + simplex.noise(x * 0.05, z * 0.05) * 3) * (1 - 0.8 * smoothstep(10, 30, z));
    return slope + n + rim - 0.1;
  }
  // 溪流中心線（平面距離用），用來在地形上挖出溪床
  const streamPoly = new THREE.CatmullRomCurve3(DATA.stream.map(([x, z]) => new THREE.Vector3(x, 0, z))).getSpacedPoints(260);
  function streamDist(x, z) {
    let m = Infinity;
    for (const p of streamPoly) { const dx = p.x - x, dz = p.z - z, d = dx * dx + dz * dz; if (d < m) m = d; }
    return Math.sqrt(m);
  }
  const streamBounds = streamPoly.reduce((b, p) => ({ x0: Math.min(b.x0, p.x - 2), x1: Math.max(b.x1, p.x + 2), z0: Math.min(b.z0, p.z - 2), z1: Math.max(b.z1, p.z + 2) }), { x0: Infinity, x1: -Infinity, z0: Infinity, z1: -Infinity });
  const channelDepth = (x, z) => {
    if (x < streamBounds.x0 || x > streamBounds.x1 || z < streamBounds.z0 || z > streamBounds.z1) return 0;
    return 0.34 * (1 - smoothstep(0.5, 1.15, streamDist(x, z)));
  };
  // 實際地面：在每片台地周圍把山坡拉到台地底下，讓台地嵌進山坡；溪流處再挖出溪床
  function hillY(x, z) { return bankY(x, z) - channelDepth(x, z); }
  // 河岸高度（不含溪床），水面、橋與溪流旁物件以此為準
  function bankY(x, z) {
    const b = baseHill(x, z);
    let wMax = 0, sumW = 0, sumT = 0;
    DATA.zones.forEach((zone, i) => {
      const d = Math.hypot(x - zone.anchor.x, z - zone.anchor.z);
      const w = 1 - smoothstep(zone.radius * 0.85, zone.radius + 2.8, d);
      if (w <= 0) return;
      wMax = Math.max(wMax, w);
      sumW += w; sumT += w * (tierTop(i) - 0.45);
    });
    return wMax > 0 ? THREE.MathUtils.lerp(b, sumT / sumW, wMax) : b;
  }

  /* ---------- 程序貼圖 ---------- */
  function canvasTexture(size, draw, repeat = true) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    draw(g, size, mulberry32(size * 7 + draw.length));
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    if (repeat) tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }
  const speckle = (g, s, r, base, dots) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (const [color, count, min, max] of dots) {
      g.fillStyle = color;
      for (let i = 0; i < count; i++) {
        const rad = min + r() * (max - min);
        g.beginPath(); g.arc(r() * s, r() * s, rad, 0, Math.PI * 2); g.fill();
      }
    }
  };
  const groundTex = {
    grass: canvasTexture(256, (g, s, r) => speckle(g, s, r, "#a3c27f", [["#94b672", 900, 1, 3], ["#b4d08f", 700, 1, 2.5], ["#86a866", 300, 1, 2], ["#f4efd8", 26, 1.2, 1.8], ["#f2d36b", 18, 1.1, 1.6]])),
    gravel: canvasTexture(256, (g, s, r) => speckle(g, s, r, "#dccfb6", [["#cbbd9f", 900, 1, 3], ["#e9dfca", 600, 1, 2.6], ["#b9aa8c", 260, 1.2, 2.4], ["#a9c084", 60, 1.5, 3]])),
    leaf: canvasTexture(256, (g, s, r) => speckle(g, s, r, "#aab97c", [["#9aa96c", 800, 1, 3], ["#c2a46a", 260, 1.5, 3.4], ["#b07e4f", 160, 1.4, 3], ["#bccb8e", 500, 1, 2.4]]))
  };
  const earthTex = canvasTexture(256, (g, s, r) => {
    const bands = ["#b28c64", "#a07a55", "#c39d72", "#9a744f", "#b8936a"];
    let y = 0;
    while (y < s) {
      const h = 10 + r() * 26;
      g.fillStyle = bands[Math.floor(r() * bands.length)];
      g.fillRect(0, y, s, h + 1);
      y += h;
    }
    for (let i = 0; i < 500; i++) {
      g.fillStyle = r() > 0.5 ? "rgba(255,240,215,.12)" : "rgba(70,45,25,.12)";
      g.fillRect(r() * s, r() * s, 2 + r() * 10, 1 + r() * 2);
    }
  });

  /* ---------- 天空 ---------- */
  const skyUniforms = {
    uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
    uSun: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uNight: { value: 0 }
  };
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(170, 48, 24),
    new THREE.ShaderMaterial({
      uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 uTop, uHorizon, uSun, uSunDir; uniform float uNight; varying vec3 vDir;
        float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
        void main(){
          vec3 d = normalize(vDir);
          vec3 c = mix(uHorizon, uTop, smoothstep(-0.02, 0.55, d.y));
          float s = max(dot(d, normalize(uSunDir)), 0.0);
          c += uSun * pow(s, 18.0) * 0.35 * (1.0 - 0.6 * uNight);
          if (uNight > 0.01 && d.y > 0.0) {
            float h = hash(floor(d * 180.0));
            c += vec3(step(0.9965, h) * uNight * smoothstep(0.0, 0.25, d.y));
          }
          gl_FragColor = vec4(c, 1.0);
          #include <colorspace_fragment>
        }`
    })
  );
  sky.renderOrder = -1;
  scene.add(sky);

  /* ---------- 光源 ---------- */
  const hemi = new THREE.HemisphereLight(0xeef6f2, 0x84906f, 1.3);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff3e0, 2.8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 22, bottom: -22, near: 1, far: 90 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.045;
  sun.shadow.radius = 3;
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.set(-20, 14, -10);
  scene.add(fill);

  /* ---------- 地面 ---------- */
  {
    const geo = new THREE.PlaneGeometry(150, 150, 230, 230).rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cA = new THREE.Color(), cB = new THREE.Color();
    const stops = [[-0.5, "#93b173"], [1.2, "#9dbb7a"], [3.0, "#88a66a"], [5.0, "#738f5c"], [7.5, "#627d52"], [10, "#958f78"]];
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const y = hillY(x, z);
      pos.setY(i, y);
      let k = 0;
      while (k < stops.length - 2 && y > stops[k + 1][0]) k++;
      const t = THREE.MathUtils.clamp((y - stops[k][0]) / (stops[k + 1][0] - stops[k][0]), 0, 1);
      cA.set(stops[k][1]); cB.set(stops[k + 1][1]); cA.lerp(cB, t);
      const jitter = 1 + (simplex.noise(x * 0.6, z * 0.6)) * 0.04;
      colors[i * 3] = cA.r * jitter; colors[i * 3 + 1] = cA.g * jitter; colors[i * 3 + 2] = cA.b * jitter;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, flatShading: true }));
    ground.receiveShadow = true;
    scene.add(ground);
  }

  /* ---------- 台地 ---------- */
  function roundedPolyShape(n, r, k, rot) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * Math.PI * 2;
      const rr = r * (0.94 + rng() * 0.1);
      pts.push(new THREE.Vector2(Math.cos(a) * rr, Math.sin(a) * rr));
    }
    const s = new THREE.Shape();
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
      const a = p1.clone().lerp(p0, k), b = p1.clone().lerp(p2, k);
      if (i === 0) s.moveTo(a.x, a.y); else s.lineTo(a.x, a.y);
      s.quadraticCurveTo(p1.x, p1.y, b.x, b.y);
    }
    s.closePath();
    return s;
  }

  const sideMat = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.92 });
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0xcdbfa8, roughness: 0.9 });
  const terraces = []; // { zone, top, mesh, outline }
  let prevTop = -Infinity;
  DATA.zones.forEach((zone, i) => {
    const { x, z } = zone.anchor;
    const r = zone.radius;
    const sides = r > 2.2 ? 8 : 6 + Math.floor(rng() * 2) * 2; // 六或八邊形
    const shape = roundedPolyShape(sides, r, 0.24, rng() * Math.PI);

    // 頂面高度：依序升高，且高於台地範圍內的地面
    let groundMax = hillY(x, z);
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * Math.PI * 2;
      groundMax = Math.max(groundMax, hillY(x + Math.cos(a) * r, z + Math.sin(a) * r), hillY(x + Math.cos(a) * r * 0.5, z + Math.sin(a) * r * 0.5));
    }
    let top = Math.max(tierTop(i), groundMax + 0.18);
    top = Math.max(top, prevTop + 0.3);
    prevTop = top;
    const bottom = hillY(x, z) - 1.2;
    const depth = top - bottom - 0.08;

    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 2, curveSegments: 6 });
    geo.rotateX(-Math.PI / 2);
    geo.translate(x, bottom, z);
    // 頂面 UV 改用世界座標 ÷2.2，讓花紋跨台地連續
    geo.computeVertexNormals();
    const p = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv;
    for (let k = 0; k < p.count; k++) {
      if (nrm.getY(k) > 0.6) uv.setXY(k, p.getX(k) / 2.2, p.getZ(k) / 2.2);
      else uv.setXY(k, uv.getX(k) * 0.5, uv.getY(k) * 0.5);
    }
    const topMat = new THREE.MeshStandardMaterial({ map: groundTex[zone.ground] || groundTex.grass, roughness: 0.92, polygonOffset: true, polygonOffsetFactor: -1 });
    const mesh = new THREE.Mesh(geo, [topMat, sideMat]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.zoneId = zone.id;
    scene.add(mesh);

    // 邊緣矮石牆
    const outline = shape.getSpacedPoints(72).map((v) => new THREE.Vector3(x + v.x * 0.96, top + 0.1, z - v.y * 0.96));
    outline.pop();
    const rim = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(outline, true), 120, 0.055, 6, true), stoneMat);
    rim.castShadow = true;
    scene.add(rim);

    terraces.push({ zone, top, mesh, outline, center: new THREE.Vector3(x, top, z) });
  });

  /* ---------- 台階（相鄰台地之間 8–12 階） ---------- */
  {
    const segs = [];
    for (let i = 0; i < terraces.length - 1; i++) {
      const A = terraces[i], B = terraces[i + 1];
      const a2 = new THREE.Vector2(A.center.x, A.center.z), b2 = new THREE.Vector2(B.center.x, B.center.z);
      const dir = b2.clone().sub(a2).normalize();
      const start = a2.clone().addScaledVector(dir, A.zone.radius - 0.25);
      const end = b2.clone().addScaledVector(dir, -(B.zone.radius - 0.25));
      const len = start.distanceTo(end);
      const n = THREE.MathUtils.clamp(Math.round(len / 0.14), 8, 12);
      const angle = Math.atan2(dir.x, dir.y);
      for (let j = 0; j < n; j++) {
        const t = (j + 0.5) / n;
        const p = start.clone().lerp(end, t);
        const y = THREE.MathUtils.lerp(A.top, B.top, (j + 1) / (n + 1));
        const g = Math.min(hillY(p.x, p.y), y) - 0.25;
        segs.push({ x: p.x, z: p.y, y0: g, y1: y + 0.02, depth: len / n + 0.02, angle, shade: j % 2 });
      }
    }
    const stepGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
    const steps = new THREE.InstancedMesh(stepGeo, new THREE.MeshStandardMaterial({ roughness: 0.88 }), segs.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
    const colA = new THREE.Color("#cfc2ab"), colB = new THREE.Color("#c2b49b");
    segs.forEach((g, i) => {
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), g.angle);
      s.set(0.78, g.y1 - g.y0, g.depth);
      v.set(g.x, g.y0, g.z);
      m.compose(v, q, s);
      steps.setMatrixAt(i, m);
      steps.setColorAt(i, g.shade ? colA : colB);
    });
    steps.castShadow = true;
    steps.receiveShadow = true;

  ]);
  {
    const curve = new THREE.CatmullRomCurve3(DATA.stream.map(([x, z]) => new THREE.Vector3(x, hillY(x, z), z)));
    const N = 220, width = 0.62;
    const total = curve.getLength();
    const positions = [], uvs = [], index = [];
    const up = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3();
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
      side.crossVectors(up, tan).normalize();
      const w = width * (0.8 + 0.35 * Math.sin(t * 23.0) * 0.5 + 0.2);
      for (const sgn of [-1, 1]) {
        const qx = p.x + side.x * w * 0.5 * sgn, qz = p.z + side.z * w * 0.5 * sgn;
        positions.push(qx, bankY(qx, qz) - 0.1, qz); // 水面低於河岸、高於溪床
        uvs.push(t * total, sgn < 0 ? 0 : 1);

    }

    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));

          gl_Position = projectionMatrix * mvPosition;

        #include <fog_pars_fragment>
        void main(){
          float edge = abs(vUv.y - 0.5) * 2.0;
          float w = sin(vUv.x * 7.0 - uTime * 2.2 + sin(vUv.y * 6.0 + vUv.x) * 1.5) * 0.5 + 0.5;
          float w2 = sin(vUv.x * 13.0 - uTime * 3.1 + vUv.y * 4.0) * 0.5 + 0.5;
          vec3 c = mix(uDeep, uShallow, edge * 0.55 + w * 0.25 + w2 * 0.1);
          c += vec3(smoothstep(0.92, 1.0, w * w2)) * 0.18 * (1.0 - edge);

          gl_FragColor = vec4(c, a * 0.92);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
          #include <fog_fragment>
        }`
    }));

      put(B, "sphere", C.sun, L(0, 1.36, 0, 0.08, 0.08, 0.08));
      put(B, "cylinder", C.woodDark, L(-0.05, 0.3, 0.02, 0.36, 0.06, 0.36));
      put(B, "box", C.ink, L(0, 0.5, 0.56, 0.62, 0.38, 0.04));
      put(B, "box", C.white, L(-0.1, 0.55, 0.585, 0.2, 0.012, 0.005));
      put(B, "box", C.white, L(0.08, 0.47, 0.585, 0.26, 0.012, 0.005));
      for (const x of [-0.27, 0.27]) put(B, "cylinder", C.woodDark, L(x, 0.25, 0.56, 0.03, 0.5, 0.03));
    },
    compassStone(B) {
      put(B, "cylinder", C.stone, L(0, 0.1, 0, 1.0, 0.2, 1.0));
      put(B, "cylinder", C.cream, L(0, 0.22, 0, 0.84, 0.04, 0.84));
      put(B, "torus", C.brown, L(0, 0.25, 0, 1.06, 1.06, 0.5, Math.PI / 2));
      put(B, "cone", C.red, L(0, 0.32, -0.18, 0.13, 0.4, 0.06, -Math.PI / 2));
      put(B, "cone", C.ink, L(0, 0.32, 0.18, 0.13, 0.4, 0.06, Math.PI / 2));
      put(B, "sphere", C.sun, L(0, 0.34, 0, 0.1, 0.07, 0.1));
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; put(B, "box", C.stone, L(Math.cos(a) * 0.48, 0.3, Math.sin(a) * 0.48, 0.1, 0.4, 0.1, 0, a, 0)); }
    },
    lookoutTower(B) {
      for (const x of [-0.3, 0.3]) for (const z of [-0.3, 0.3]) put(B, "cylinder", C.woodDark, L(x, 0.62, z, 0.08, 1.24, 0.08));
      put(B, "box", C.wood, L(0, 1.24, 0, 0.86, 0.08, 0.86));
      for (const [x, z, sx, sz] of [[0, -0.4, 0.86, 0.04], [-0.4, 0, 0.04, 0.86], [0.4, 0, 0.04, 0.86]]) put(B, "box", C.wood, L(x, 1.38, z, sx, 0.2, sz));
      put(B, "hip", C.red, L(0, 1.68, 0, 1.0, 0.42, 1.0));
      for (const x of [-0.12, 0.12]) put(B, "box", C.woodDark, L(x, 0.62, 0.38, 0.03, 1.24, 0.03));
      for (let k = 0; k < 6; k++) put(B, "box", C.woodDark, L(0, 0.15 + k * 0.2, 0.38, 0.26, 0.025, 0.025));
    },
    bookTreehouse(B) {
      const cols = [C.blue, C.red, C.forest, C.sun, C.brown, C.teal];
      let y = 0;
      cols.forEach((c, i) => { put(B, "box", c, L(-0.26, y + 0.09, 0.05, 0.42 - i * 0.03, 0.18, 0.32, 0, (rng() - 0.5) * 0.5, 0)); y += 0.18; });
      put(B, "cylinder", C.brown, L(0.24, 0.55, -0.05, 0.16, 1.1, 0.16));
      for (const [x, yy, z, s] of [[0.2, 1.3, -0.1, 0.62], [0.45, 1.15, 0.05, 0.42], [0.02, 1.2, 0.08, 0.44]]) put(B, "ico", C.leaf3, L(x, yy, z, s, s * 0.85, s));
      put(B, "box", C.wood, L(0.24, 0.86, 0.08, 0.34, 0.24, 0.26));
      put(B, "hip", C.red, L(0.24, 1.06, 0.08, 0.44, 0.18, 0.36));
      put(B, "glowbox", C.warm, L(0.24, 0.86, 0.215, 0.1, 0.1, 0.01));
    },
    cabin(B) {
      put(B, "box", C.wood, L(0, 0.32, -0.08, 0.82, 0.62, 0.6));
      put(B, "hip", C.brown, L(0, 0.8, -0.08, 1.04, 0.38, 0.8));
      put(B, "box", C.woodDark, L(0, 0.22, 0.225, 0.16, 0.36, 0.02));
      for (const x of [-0.25, 0.25]) put(B, "glowbox", C.warm, L(x, 0.4, 0.225, 0.14, 0.13, 0.02));
      put(B, "box", C.stone, L(0.3, 0.9, -0.2, 0.12, 0.3, 0.12));
      for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2; put(B, "ico", C.stone, L(Math.cos(a) * 0.17, 0.05, 0.5 + Math.sin(a) * 0.17, 0.09, 0.07, 0.09)); }
      put(B, "glowsphere", C.orange, L(0, 0.14, 0.5, 0.14, 0.22, 0.14));
      put(B, "cylinder", C.woodDark, L(-0.36, 0.07, 0.5, 0.1, 0.36, 0.1, Math.PI / 2, 0.2, 0));
    },
    windmillTrack(B) {
      put(B, "torus", C.red, L(0, 0.03, 0.18, 1.25, 0.85, 0.2, Math.PI / 2));
      put(B, "torus", C.cream, L(0, 0.035, 0.18, 1.05, 0.65, 0.12, Math.PI / 2));
      put(B, "cylinder", C.cream, L(0, 0.62, -0.25, 0.32, 1.24, 0.32));
      put(B, "cone", C.blue, L(0, 1.36, -0.25, 0.4, 0.26, 0.4));
      put(B, "sphere", C.woodDark, L(0, 1.1, -0.06, 0.1, 0.1, 0.1));
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + 0.3; put(B, "box", C.white, L(Math.cos(a) * 0.3, 1.1 + Math.sin(a) * 0.3, -0.04, 0.56, 0.1, 0.02, 0, 0, a)); }
      put(B, "glowbox", C.warm, L(0, 0.62, -0.09, 0.1, 0.14, 0.01));
    },
    rootTree(B) {
      put(B, "cylinder", C.brown, L(0, 0.5, 0, 0.3, 1.0, 0.3));
      for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2 + 0.3; put(B, "cylinder", C.brown, L(Math.cos(a) * 0.2, 0.07, Math.sin(a) * 0.2, 0.08, 0.42, 0.08, Math.sin(a) * 1.1, 0, -Math.cos(a) * 1.1)); }
      for (const [x, y, z, s] of [[0, 1.25, 0, 0.82], [0.32, 1.1, 0.1, 0.55], [-0.3, 1.12, -0.05, 0.58], [0.05, 1.5, -0.1, 0.5]]) put(B, "ico", C.leaf2, L(x, y, z, s, s * 0.85, s));
      for (let k = 0; k < 9; k++) { const a = rng() * Math.PI * 2, r = 0.25 + rng() * 0.2; put(B, "sphere", k % 3 ? C.orange : C.red, L(Math.cos(a) * r, 0.95 + rng() * 0.5, Math.sin(a) * r + 0.12, 0.09, 0.09, 0.09)); }
      put(B, "box", C.wood, L(0.5, 0.2, 0.38, 0.3, 0.06, 0.24));
      for (const x of [0.38, 0.62]) put(B, "cylinder", C.woodDark, L(x, 0.3, 0.38, 0.03, 0.6, 0.03));
      put(B, "prism", C.red, L(0.5, 0.62, 0.38, 0.12, 0.36, 0.3, 0, 0, Math.PI / 2));
    },
    nestTower(B) {
      put(B, "cylinder", C.stone, L(0, 0.6, 0, 0.36, 1.2, 0.36));
      put(B, "cylinder", C.stone, L(0, 1.22, 0, 0.52, 0.06, 0.52));
      put(B, "torus", C.woodDark, L(0, 1.32, 0, 0.62, 0.62, 0.9, Math.PI / 2));
      for (const [x, z] of [[-0.05, 0.03], [0.07, -0.04], [0.02, 0.08]]) put(B, "sphere", "#cfe3ee", L(x, 1.3, z, 0.08, 0.1, 0.08));
      [[C.blue, 0.3], [C.red, 1.9], [C.sun, 3.5], [C.forest, 5.0]].forEach(([c, a]) => {
        const x = Math.cos(a) * 0.55, z = Math.sin(a) * 0.55;
        put(B, "cylinder", C.ink, L(x, 0.5, z, 0.03, 1.0, 0.03));
        put(B, "box", c, L(x + 0.12, 0.88, z, 0.24, 0.15, 0.015));
      });
      put(B, "glowbox", C.warm, L(0, 0.7, 0.182, 0.08, 0.14, 0.01));
    },
    summitDeck(B) {
      put(B, "rbox", C.wood, L(0, 0.08, 0, 1.15, 0.14, 0.85));
      for (let k = 0; k < 5; k++) put(B, "cylinder", C.woodDark, L(-0.5 + k * 0.25, 0.32, -0.38, 0.04, 0.36, 0.04));
      put(B, "box", C.woodDark, L(0, 0.49, -0.38, 1.05, 0.04, 0.04));
      const T = B.clone().multiply(L(-0.2, 0.15, 0.05, 1.35, 1.35, 1.35));
      for (let k = 0; k < 3; k++) {
        const a = (k / 3) * Math.PI * 2 + 0.3;
        put(T, "cylinder", C.ink, L(Math.cos(a) * 0.16, 0.38, Math.sin(a) * 0.16, 0.04, 0.62, 0.04, -Math.sin(a) * 0.32, 0, Math.cos(a) * 0.32));
      }
      put(T, "cylinder", C.sun, L(0.05, 0.78, 0, 0.13, 0.62, 0.13, 0, 0, -1.0));
      put(T, "cylinder", C.glass, L(0.31, 0.95, 0, 0.16, 0.04, 0.16, 0, 0, -1.0));
      put(B, "box", C.wood, L(0.35, 0.3, 0.12, 0.36, 0.05, 0.14));
      for (const x of [0.22, 0.48]) put(B, "box", C.woodDark, L(x, 0.21, 0.12, 0.04, 0.14, 0.12));
    }
  };

  /* ---------- 樹種（單位高度約 1.6） ---------- */
  const TREES = {
    conifer(B, layer) {
      put(B, "cylinder", C.brown, L(0, 0.2, 0, 0.1, 0.4, 0.1), layer);
      [[0.62, 0.7, 0.62], [0.48, 1.05, 0.5], [0.34, 1.38, 0.4]].forEach(([s, y, h]) => put(B, "cone", C.leaf3, L(0, y, 0, s, h, s), layer));
    },
    broadleaf(B, layer) {
      put(B, "cylinder", C.brown, L(0, 0.35, 0, 0.11, 0.7, 0.11), layer);
      [[0, 1.0, 0, 0.62], [0.2, 0.9, 0.1, 0.42], [-0.18, 0.92, -0.08, 0.44]].forEach(([x, y, z, s]) => put(B, "ico", C.leaf2, L(x, y, z, s, s * 0.9, s), layer));
    },
    blossom(B, layer) {
      put(B, "cylinder", C.brown, L(0, 0.33, 0, 0.1, 0.66, 0.1), layer);
      [[0, 0.95, 0, 0.6], [0.2, 0.85, 0.08, 0.38], [-0.18, 0.88, -0.06, 0.4]].forEach(([x, y, z, s]) => put(B, "ico", C.pink, L(x, y, z, s, s * 0.85, s), layer));
    },
    maple(B, layer) {
      put(B, "cylinder", C.brown, L(0, 0.33, 0, 0.1, 0.66, 0.1), layer);
      [[0, 0.98, 0, 0.6], [0.2, 0.86, 0.1, 0.4]].forEach(([x, y, z, s], i) => put(B, "ico", i ? C.orange : "#d1663b", L(x, y, z, s, s * 0.9, s), layer));
    },
    fruit(B, layer) {
      put(B, "cylinder", C.brown, L(0, 0.3, 0, 0.1, 0.6, 0.1), layer);
      put(B, "ico", C.leaf2, L(0, 0.9, 0, 0.7, 0.62, 0.7), layer);
      for (let k = 0; k < 5; k++) { const a = rng() * Math.PI * 2; put(B, "sphere", C.orange, L(Math.cos(a) * 0.3, 0.8 + rng() * 0.25, Math.sin(a) * 0.3, 0.08, 0.08, 0.08), layer); }
    },
    bamboo(B, layer) {
      for (let k = 0; k < 6; k++) {
        const a = rng() * Math.PI * 2, r = rng() * 0.18, h = 1.3 + rng() * 0.6;
        put(B, "cylinder", "#8fb25e", L(Math.cos(a) * r, h / 2, Math.sin(a) * r, 0.04, h, 0.04, (rng() - 0.5) * 0.12, 0, (rng() - 0.5) * 0.12), layer);
        put(B, "ico", C.leaf2, L(Math.cos(a) * r, h, Math.sin(a) * r, 0.22, 0.14, 0.22), layer);
      }
    }
  };

  /* ---------- 擺放：地標、細項、植物與街道小物件 ---------- */
  // 與溪流網格使用相同的控制點與高度，getPointAt 才會落在同一位置
  const streamCurve2D = new THREE.CatmullRomCurve3(DATA.stream.map(([x, z]) => new THREE.Vector3(x, hillY(x, z), z)));
  const distToStream = streamDist;
  const insideTerrace = (x, z, pad = 0) => terraces.some((t) => Math.hypot(x - t.center.x, z - t.center.z) < t.zone.radius + pad);
  const itemPlacements = new Map(); // 細項 id → { pos, top, size }，M3 用於 pin 與選取

  terraces.forEach((t, ti) => {
    const { x, z } = t.zone.anchor;
    const r = t.zone.radius;
    const top = t.top + 0.01;

    // 主地標：預設在台地後側中央（-z 方向為山上）；landmarkSpot 為 front 時放在正前方
    const lmScale = 1.15 * (r / 2.0);
    const lmFront = DATA.landmarkSpot[t.zone.id] === "front";
    const lmPos = new THREE.Vector3(x, top, lmFront ? z + r * 0.5 : z - r * 0.42);
    kitTag = "zone:" + t.zone.id;
    LANDMARKS[DATA.landmarks[t.zone.id]](baseAt(lmPos.x, top, lmPos.z, lmScale, 0));
    kitTag = null;

    // 細項：交錯格子，格子大小依數量從 0.62 縮到 0.46
    const items = DATA.items.filter((it) => it.zone === t.zone.id);
    const inner = r * 0.8 - 0.25;
    let cells = [], size = 0.62;
    for (size = 0.62; size >= 0.46; size -= 0.04) {
      cells = [];
      const rowH = size * 0.88;
      for (let row = -6; row <= 6; row++) {
        for (let col = -6; col <= 6; col++) {
          const cx = x + (col + (row % 2 ? 0.5 : 0)) * size, cz = z + row * rowH;
          if (Math.hypot(cx - x, cz - z) > inner) continue;
          if (Math.hypot(cx - lmPos.x, cz - lmPos.z) < lmScale * 0.78 + size * 0.4) continue;
          if (cz > z + r * (lmFront ? 0.2 : 0.62)) continue; // 前緣留給標籤（或大門）
          cells.push({ x: cx, z: cz });
        }
      }
      if (cells.length >= items.length) break;
    }
    size = Math.max(size, 0.46);
    // 由靠近中心、偏前方的格子開始放
    cells.sort((a, b) => Math.hypot(a.x - x, (a.z - z) - 0.3) - Math.hypot(b.x - x, (b.z - z) - 0.3));
    items.forEach((it, k) => {
      const c = cells[k];
      if (!c) return;
      const s = size * 0.82;
      kitTag = "item:" + it.id;
      MODELS[it.model](baseAt(c.x, top, c.z, s, (rng() - 0.5) * 0.5));
      kitTag = null;
      itemPlacements.set(it.id, { pos: new THREE.Vector3(c.x, top, c.z), size: s });
    });

    // 外圍大樹 4–6 棵（地面上），避開台階方向、溪流與其他台地
    const neighbors = [terraces[ti - 1], terraces[ti + 1]].filter(Boolean).map((n) => Math.atan2(n.center.z - z, n.center.x - x));
    const treeCount = 4 + Math.floor(rng() * 3);
    let placed = 0;
    for (let tries = 0; tries < 60 && placed < treeCount; tries++) {
      const a = rng() * Math.PI * 2;
      if (neighbors.some((n) => Math.abs(Math.atan2(Math.sin(a - n), Math.cos(a - n))) < 0.55)) continue;
      const d = r + 0.55 + rng() * 0.9;
      const tx = x + Math.cos(a) * d, tz = z + Math.sin(a) * d;
      if (insideTerrace(tx, tz, 0.35) || distToStream(tx, tz) < 0.9) continue;
      TREES[DATA.trees[t.zone.id]](baseAt(tx, hillY(tx, tz) - 0.05, tz, 0.85 + rng() * 0.45, rng() * Math.PI * 2));
      placed++;
    }

    // 台地邊緣：路燈（每片 3 盞）與串燈
    const rimPts = t.outline;
    [0.15, 0.48, 0.8].forEach((f) => {
      const p = rimPts[Math.floor(f * rimPts.length)];
      const ix = x + (p.x - x) * 0.9, iz = z + (p.z - z) * 0.9;
      put(baseAt(ix, top, iz, 1), "cylinder", C.ink, L(0, 0.36, 0, 0.035, 0.72, 0.035));
      put(baseAt(ix, top, iz, 1), "glowsphere", C.warm, L(0, 0.76, 0, 0.11, 0.11, 0.11));
    });
    for (let k = 0; k < rimPts.length; k += 3) {
      const p = rimPts[k];
      put(baseAt(p.x, p.y + 0.09, p.z, 1), "glowsphere", C.white, L(0, 0, 0, 0.05, 0.05, 0.05));
    }

    // 台地上的植物（總覽也看得到）：避開地標、細項與前緣標籤
    const placedItems = items.map((it) => itemPlacements.get(it.id)).filter(Boolean);
    const freeSpot = (px, pz, pad) =>
      Math.hypot(px - lmPos.x, pz - lmPos.z) > lmScale * 0.62 + pad &&
      placedItems.every((p) => Math.hypot(px - p.pos.x, pz - p.pos.z) > p.size * 0.55 + pad) &&
      !(pz > z + r * 0.62 && Math.abs(px - x) < 0.9);
    // 小樹 2 棵，樹種與該區外圍樹相同
    let smallTrees = 0;
    for (let tries = 0; tries < 40 && smallTrees < 2; tries++) {
      const p = rimPts[Math.floor(rng() * rimPts.length)];
      const f = 0.68 + rng() * 0.08;
      const sx = x + (p.x - x) * f, sz = z + (p.z - z) * f;
      if (!freeSpot(sx, sz, 0.3)) continue;
      TREES[DATA.trees[t.zone.id]](baseAt(sx, top, sz, 0.42 + rng() * 0.14, rng() * Math.PI * 2));
      smallTrees++;
    }
    // 灌木與花圃
    for (let k = 0; k < 12; k++) {
      const p = rimPts[Math.floor(rng() * rimPts.length)];
      const f = 0.76 + rng() * 0.08;
      const bx = x + (p.x - x) * f, bz = z + (p.z - z) * f;
      if (!freeSpot(bx, bz, 0.12)) continue;
      const s = 0.22 + rng() * 0.16;
      put(baseAt(bx, top, bz, 1), "ico", rng() > 0.5 ? C.leaf2 : C.leaf3, L(0, s * 0.42, 0, s, s * 0.82, s));
    }
    for (let k = 0; k < 7; k++) {
      const p = rimPts[Math.floor(rng() * rimPts.length)];
      const f = 0.8 + rng() * 0.05;
      const cx = x + (p.x - x) * f, cz = z + (p.z - z) * f;
      if (!freeSpot(cx, cz, 0.1)) continue;
      const col = [C.pink, C.sun, C.white, "#c9a4e0", C.orange][Math.floor(rng() * 5)];
      for (let j = 0; j < 5; j++) {
        const a = rng() * Math.PI * 2, d = rng() * 0.13;
        put(baseAt(cx + Math.cos(a) * d, top, cz + Math.sin(a) * d, 1), "sphere", col, L(0, 0.07, 0, 0.09, 0.08, 0.09));
        put(baseAt(cx + Math.cos(a) * d, top, cz + Math.sin(a) * d, 1), "cylinder", C.leaf2, L(0, 0.03, 0, 0.02, 0.06, 0.02), "small");
      }
    }
    for (const f of [0.3, 0.65]) {
      const p = rimPts[Math.floor(f * rimPts.length)];
      const bx = x + (p.x - x) * 0.82, bz = z + (p.z - z) * 0.82;
      const ry = Math.atan2(x - bx, z - bz);
      const Bn = baseAt(bx, top, bz, 1, ry);
      put(Bn, "box", C.wood, L(0, 0.13, 0, 0.36, 0.035, 0.12), "small");
      put(Bn, "box", C.wood, L(0, 0.22, -0.055, 0.36, 0.12, 0.025), "small");
      for (const lx of [-0.15, 0.15]) put(Bn, "box", C.woodDark, L(lx, 0.06, 0, 0.03, 0.12, 0.1), "small");
    }
  });

  // 溪上小木橋兩座：橋身（局部 x 軸）與溪流方向垂直，橫跨兩岸
  [0.36, 0.7].forEach((tt) => {
    const p = streamCurve2D.getPointAt(tt), tan = streamCurve2D.getTangentAt(tt);
    const ry = Math.atan2(tan.x, tan.z); // 讓局部 x 軸 (cos ry, -sin ry) 垂直於切線 (tan.x, tan.z)
    MODELS.bridge(baseAt(p.x, bankY(p.x, p.z) - 0.04, p.z, 1.4, ry), { onStream: true });
  });

  /* ---------- 遠景：梯田與小鎮燈火（象徵山城） ---------- */
  [[-24, -22, 0.4], [22, -26, -0.5], [-30, 2, 1.2], [28, 4, -1.1], [10, -34, 0.1]].forEach(([fx, fz, ry]) => {
    const steps = 5;
    for (let k = 0; k < steps; k++) {
      const off = k * 1.3;
      const cx = fx + Math.sin(ry) * off, cz = fz - Math.cos(ry) * off;
      const y = hillY(cx, cz);
      const col = k % 2 ? "#b9c97a" : "#d3c36f";

  /* ---------- 背景樹（數千棵 InstancedMesh，不投影） ---------- */
  function withColor(geo, hex) {
    const g = geo.index ? geo.toNonIndexed() : geo; // 二十面體本來就是非索引幾何
    const c = new THREE.Color(hex);
    const arr = new Float32Array(g.attributes.position.count * 3);
    for (let i = 0; i < arr.length; i += 3) { arr[i] = c.r; arr[i + 1] = c.g; arr[i + 2] = c.b; }
    g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    g.deleteAttribute("uv");
    return g;
  }
  const trunkGeo = () => new THREE.CylinderGeometry(0.06, 0.09, 0.6, 6).translate(0, 0.3, 0);
  const coniferGeo = BufferGeometryUtils.mergeGeometries([
    withColor(trunkGeo(), "#6b4a33"),

    withColor(new THREE.ConeGeometry(0.4, 0.75, 7).translate(0, 1.35, 0), "#ffffff"),
    withColor(new THREE.ConeGeometry(0.28, 0.55, 7).translate(0, 1.7, 0), "#ffffff")
  ]);
  const broadGeo = BufferGeometryUtils.mergeGeometries([
    withColor(trunkGeo(), "#6b4a33"),
    ...[[0, 1.0, 0, 0.5], [0.22, 0.88, 0.08, 0.34], [-0.2, 0.9, -0.06, 0.36], [0.02, 1.25, -0.04, 0.32]].map(([x, y, z, s]) => {
      const g = new THREE.IcosahedronGeometry(s, 0);

      for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) * (0.92 + rng() * 0.16), p.getY(i) * (0.85 + rng() * 0.15), p.getZ(i) * (0.92 + rng() * 0.16));
      return withColor(g.translate(x, y, z), "#ffffff");
    })
  ]);
  const treeMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.92 });
  {
    const want = isMobile() ? 900 : 2000;
    const center = new THREE.Vector2(0.5, 2);
    const con = [], brd = [];
    let guard = 0;
    while (con.length + brd.length < want && guard++ < want * 10) {
      const a = rng() * Math.PI * 2, d = 13 + Math.sqrt(rng()) * 44;

      if (Math.abs(x) > 72 || Math.abs(z) > 72) continue;
      if (z > 11 && Math.abs(x) < 16 + (z - 11) * 1.2) continue; // 鏡頭前方留空，不遮住步道
      if (rng() > 0.12 + smoothstep(14, 28, d) * 0.88) continue;

  }

  /* ---------- 遠山剪影帶（三層，顏色往地平線色混合） ---------- */
  const ridges = [];
  [[78, 9, 12, 0.3, "#6f8f6a"], [104, 16, 16, 0.55, "#7d9a86"], [132, 26, 18, 0.75, "#93a8a6"]].forEach(([R, base, amp, k, hex], idx) => {

  /* ---------- 雲（12 團，沿 +x 漂移，超出範圍後繞回） ---------- */
  const clouds = [];

  const _cm = new THREE.Matrix4(), _cp = new THREE.Vector3(), _cs = new THREE.Vector3(), _cq = new THREE.Quaternion();
  function updateClouds(dt) {
    let i = 0;
    for (const c of clouds) {
      c.x += dt * c.speed;
      if (c.x > 80) c.x = -80;
      for (const p of c.puffs) {
        _cp.set(c.x + p.x, c.y + p.y, c.z + p.z);
        _cs.set(p.s, p.s * 0.62, p.s * 0.85);

    }

  updateClouds(0);

  /* ============================================================
     M4：步道路網、動物角色、概念線、badge、生態排程
     ============================================================ */

  /* ---------- 步道路網（每片台地 12 個節點連成環，台階連接相鄰台地） ---------- */
  const nodes = [];      // { p: Vector3 }
  const adj = [];        // adj[i] = [{ to, w }]
  const addNode = (p) => { nodes.push({ p }); adj.push([]); return nodes.length - 1; };
  const link = (a, b) => { const w = nodes[a].p.distanceTo(nodes[b].p); adj[a].push({ to: b, w }); adj[b].push({ to: a, w }); };
  const ringOf = new Map(); // zoneId → [node index]
  terraces.forEach((t) => {
    const ring = [];
    for (let k = 0; k < 12; k++) {
      const o = t.outline[Math.floor((k / 12) * t.outline.length)];
      const p = new THREE.Vector3(t.center.x + (o.x - t.center.x) * 0.88, t.top + 0.01, t.center.z + (o.z - t.center.z) * 0.88);
      ring.push(addNode(p));
    }
    ring.forEach((n, k) => link(n, ring[(k + 1) % ring.length]));
    ringOf.set(t.zone.id, ring);
  });
  const nearestOf = (list, p, n = 1) => list.slice().sort((a, b) => nodes[a].p.distanceTo(p) - nodes[b].p.distanceTo(p)).slice(0, n);
  for (let i = 0; i < terraces.length - 1; i++) {
    const A = terraces[i], B = terraces[i + 1];
    const dir = new THREE.Vector3(B.center.x - A.center.x, 0, B.center.z - A.center.z).normalize();
    const sA = addNode(new THREE.Vector3(A.center.x + dir.x * (A.zone.radius - 0.25), A.top + 0.03, A.center.z + dir.z * (A.zone.radius - 0.25)));
    const sB = addNode(new THREE.Vector3(B.center.x - dir.x * (B.zone.radius - 0.25), B.top + 0.03, B.center.z - dir.z * (B.zone.radius - 0.25)));
    link(sA, sB);
    nearestOf(ringOf.get(A.zone.id), nodes[sA].p, 2).forEach((n) => link(sA, n));
    nearestOf(ringOf.get(B.zone.id), nodes[sB].p, 2).forEach((n) => link(sB, n));
  }
  function dijkstra(src, dst) {
    const dist = new Array(nodes.length).fill(Infinity), prev = new Array(nodes.length).fill(-1), done = new Array(nodes.length).fill(false);
    dist[src] = 0;
    for (let iter = 0; iter < nodes.length; iter++) {
      let u = -1;
      for (let i = 0; i < nodes.length; i++) if (!done[i] && (u < 0 || dist[i] < dist[u])) u = i;
      if (u < 0 || dist[u] === Infinity) break;
      if (u === dst) break;
      done[u] = true;
      for (const { to, w } of adj[u]) if (dist[u] + w < dist[to]) { dist[to] = dist[u] + w; prev[to] = u; }
    }
    const path = [];
    for (let v = dst; v >= 0; v = prev[v]) path.unshift(v);
    return path[0] === src ? path : [src, dst];
  }
  // 細項 → 路線端點（細項旁邊，朝最近的環狀節點）
  function itemEndpoint(itemId) {
    const it = DATA.items.find((i) => i.id === itemId);
    const pl = itemPlacements.get(itemId);
    const ring = ringOf.get(it.zone);
    const n = nearestOf(ring, pl.pos)[0];
    const toward = nodes[n].p.clone().sub(pl.pos).setY(0).normalize();
    return { node: n, p: pl.pos.clone().addScaledVector(toward, pl.size * 0.62).setY(pl.pos.y + 0.01) };
  }
  // 建立折線路徑與累計長度
  function makePath(points, loop = false) {
    const pts = points.slice();
    if (loop) pts.push(pts[0].clone());
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
    return { pts, cum, len: cum[cum.length - 1], loop };
  }
  function samplePath(path, s, out, dirOut) {
    const { pts, cum, len } = path;
    s = path.loop ? ((s % len) + len) % len : THREE.MathUtils.clamp(s, 0, len);
    let i = 1;
    while (i < cum.length - 1 && cum[i] < s) i++;
    const seg = cum[i] - cum[i - 1] || 1;
    const t = (s - cum[i - 1]) / seg;
    out.lerpVectors(pts[i - 1], pts[i], t);
    dirOut.subVectors(pts[i], pts[i - 1]).setY(0).normalize();
    return out;
  }
  const trailPaths = new Map();
  DATA.trails.forEach((tr) => {
    if (!itemPlacements.has(tr.from) || !itemPlacements.has(tr.to)) return;
    const a = itemEndpoint(tr.from), b = itemEndpoint(tr.to);
    const route = dijkstra(a.node, b.node).map((n) => nodes[n].p.clone());
    trailPaths.set(tr.id, makePath([a.p, ...route, b.p]));
  });

  /* ---------- 擬人 chibi 動物（單位高度約 1，頭部約佔 40%） ---------- */
  // 每個零件：g 幾何、c 顏色、p 位置、s 縮放、r 旋轉；sw 表示會擺動的四肢（以 pv 為支點）
  function chibi(sp) {

    add("cylinder", pal.leg, [-0.07, 0.11, 0], [0.08, 0.22, 0.08], [0, 0, 0], "legL", [-0.07, 0.22, 0]);

    add("sphere", pal.body, [0, 0.38, 0], [0.32, 0.38, 0.28]);

    const armS = armG === "box" ? [0.05, 0.24, 0.14] : [0.06, 0.2, 0.06];
    add(armG, sp === "pangolin" || sp === "hare" || sp === "partridge" ? pal.body : pal.body, [-0.19, 0.4, 0], armS, [0, 0, 0.25], "armL", [-0.17, 0.5, 0]);
    add(armG, pal.body, [0.19, 0.4, 0], armS, [0, 0, -0.25], "armR", [0.17, 0.5, 0]);
    add("sphere", pal.head, [0, 0.74, 0], [0.44, 0.42, 0.42]);

      add("cylinder", C.ink, [-0.045, 0.47, 0.17], [0.05, 0.09, 0.05], [Math.PI / 2, 0, 0]);
      add("cylinder", C.ink, [0.045, 0.47, 0.17], [0.05, 0.09, 0.05], [Math.PI / 2, 0, 0]);
    } else if (sp === "magpie") {
      add("cone", C.red, [0, 0.71, 0.24], [0.08, 0.14, 0.08], [Math.PI / 2, 0, 0]);

      add("box", C.white, [0, 0.16, -0.48], [0.08, 0.041, 0.1], [0.5, 0, 0]);

      add("sphere", C.pink, [0.08, 1.0, 0.005], [0.045, 0.22, 0.02], [0, 0, -0.15]);
      add("sphere", C.white, [0, 0.3, -0.17], [0.1, 0.1, 0.1]);
      add("sphere", C.pink, [0, 0.72, 0.21], [0.05, 0.04, 0.03]);

      add("cone", "#c9a46a", [0, 0.71, 0.23], [0.07, 0.12, 0.07], [Math.PI / 2, 0, 0]);
      add("sphere", C.red, [-0.12, 0.71, 0.15], [0.07, 0.05, 0.03]);
      add("sphere", C.red, [0.12, 0.71, 0.15], [0.07, 0.05, 0.03]);

  }
  function addLoloScarf(P) { P.push({ g: "torus", c: C.red, p: [0, 0.56, 0], s: [0.44, 0.44, 0.7], r: [Math.PI / 2, 0, 0], sw: null, pv: null }); }

  /* ---------- 建立角色實例 ---------- */
  const walkers = [];
  const charGeos = { sphere: GEO.sphere, cone: GEO.cone, cylinder: GEO.cylinder, box: GEO.box, dome: GEO.dome, torus: GEO.torus };
  const charCount = {};
  const mobile = isMobile();
  const inWindow = (win, m) => !win || (win[0] <= win[1] ? m >= win[0] && m < win[1] : m >= win[0] || m < win[1]);
  function spawn(opts) {
    const parts = chibi(opts.species);
    if (opts.lolo) addLoloScarf(parts);
    parts.forEach((p) => { charCount[p.g] = (charCount[p.g] || 0) + 1; });
    const sp = DATA.cast[opts.species];
    walkers.push({
      ...opts, parts, slots: [],
      speed: sp.speed[0] + rng() * (sp.speed[1] - sp.speed[0]),
      phase: rng(), s: opts.s ?? 0, dir: 1, pause: 0, vis: 0, side: (rng() > 0.5 ? 1 : -1) * (0.05 + rng() * 0.07),
      pos: new THREE.Vector3(), fwd: new THREE.Vector3(0, 0, 1)
    });
  }
  DATA.trails.forEach((tr) => {
    const path = trailPaths.get(tr.id);
    if (!path) return;
    const sp = DATA.cast[tr.walker];
    const n = THREE.MathUtils.clamp(Math.round(path.len / 9) + 1, mobile ? 1 : 2, mobile ? 2 : 4);
    for (let k = 0; k < n; k++) spawn({ species: tr.walker, trail: tr, path, s: ((k + 0.5) / n) * path.len, active: sp.active });
    const extra = mobile ? 0 : Math.min(1, sp.nightExtra || 0);
    for (let k = 0; k < extra; k++) spawn({ species: tr.walker, trail: tr, path, s: rng() * path.len, active: [1020, 360] });
  });
  DATA.ambient.forEach((am) => {
    if (am.route) {
      // 指定起訖區塊：沿步道路網來回（到端點停留後折返）
      const [za, zb] = am.route.map((z) => terraces.find((t) => t.zone.id === z));
      const a = nearestOf(ringOf.get(za.zone.id), new THREE.Vector3(za.center.x, za.top, za.center.z + za.zone.radius))[0];
      const b = nearestOf(ringOf.get(zb.zone.id), zb.center)[0];
      const path = makePath(dijkstra(a, b).map((n) => nodes[n].p.clone()));
      for (let k = 0; k < am.count; k++) spawn({ species: am.walker, path, lolo: !!am.lolo, s: 0, active: DATA.cast[am.walker].active });
      return;
    }
    const ring = ringOf.get(am.zone);
    const path = makePath(ring.map((n) => nodes[n].p.clone()), true);
    for (let k = 0; k < am.count; k++) spawn({ species: am.walker, path, loopPath: true, lolo: !!am.lolo, s: (k / am.count) * path.len, active: DATA.cast[am.walker].active });

  const soarZone = terraces.find((t) => t.zone.id === DATA.soaring.zone);

  /* ---------- 概念線（沿路網的管狀線，實線／虛線／點線，圖樣流動） ---------- */
  const lineUniformTime = { value: 0 };
  const conceptLines = [];
  const LINK_STYLE = { case: 0, concept: 1, extend: 2 };
  DATA.trails.forEach((tr) => {
    const path = trailPaths.get(tr.id);
    if (!path) return;
    const cp = new THREE.CurvePath();
    for (let i = 1; i < path.pts.length; i++) {

  /* ---------- HUD 開關：角色名、背包、概念線 ---------- */

  /* ---------- 每幀更新角色 ---------- */

  function updateWalkers(dt, animate, camDist) {

    const showBadge = toggles.packs && camDist < 16;
    walkers.forEach((w, wi) => {
      // 生態排程：不在活動時段就淡出
      const want = inWindow(w.active, minuteNow) ? 1 : 0;
      w.vis = reducedMotion ? want : THREE.MathUtils.clamp(w.vis + (want - w.vis) * Math.min(1, dt * 2.5), 0, 1);
      if (w.vis < 0.02) {

        if (w.tag) w.tag.visible = false;

      }
      let walking = false, flying = false, flap = 0;

        if (near) w.tag.position.set(w.pos.x, w.pos.y + k * 1.6, w.pos.z);
      }

  /* ---------- 區塊標籤 ---------- */

  cityCenter.y = 1.6;

  /* ============================================================

  /* ---------- 點擊場景：移動 ≤ 6px 才 raycast ---------- */
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const charOwner = new Map(); // InstancedMesh → [walker per instance]
  walkers.forEach((w) => w.slots.forEach(({ im, idx }) => { const arr = charOwner.get(im) || []; arr[idx] = w; charOwner.set(im, arr); }));
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener("pointerup", (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const targets = [...Object.values(charMeshes), ...conceptLines.filter((m) => m.visible), ...kitMeshes.main, ...terraces.map((t) => t.mesh)];
    const hit = raycaster.intersectObjects(targets, false)[0];
    if (!hit) return;
    const o = hit.object;
    if (charOwner.has(o)) {
      const w = charOwner.get(o)[hit.instanceId];
      if (w && w.trail) return select("trail", w.trail.id, { walker: w });

    if (o.userData.trailId) return select("trail", o.userData.trailId);

      if (tag && tag.startsWith("zone:")) return select("zone", tag.slice(5));
    }
    if (o.userData.zoneId) return select("zone", o.userData.zoneId);
    const near = terraces.find((t) => Math.hypot(hit.point.x - t.center.x, hit.point.z - t.center.z) < t.zone.radius + 0.2);
    if (near) select("zone", near.zone.id);
  });

  // 從重點句子中抓出數字，做成大數字磚
  function numberTiles(facts) {
    const re = /(?:US\$|NT\$)?\d[\d,]*(?:\.\d+)?(?:\s?[–-]\s?\d[\d,]*(?:\.\d+)?)?\s?(?:%|億美元|兆新台幣|億|萬|billion|million|trillion)?/g;
    const tiles = [];
    facts.forEach((f) => {
      const text = pick(f);
      const ms = (text.match(re) || []).map((s) => s.trim()).filter((s) => s.length > 1 || /\d/.test(s));
      const score = (s) => (/%|\$|億|萬|兆|billion|million/.test(s) ? 3 : 0) + (/^(19|20)\d\d$/.test(s) ? -2 : 0) + s.length * 0.1;
      const best = ms.sort((a, b) => score(b) - score(a))[0];
      if (best && score(best) > 0) tiles.push({ num: best, cap: text });
    });
    return tiles.slice(0, 3);
  }

  /* ---------- 影片：canvas 預覽卡，點擊後才載入 youtube-nocookie ---------- */
  function drawVideoPreview(cv) {
    const g = cv.getContext("2d");
    const grd = g.createLinearGradient(0, 0, 320, 180);
    grd.addColorStop(0, "#004030"); grd.addColorStop(1, "#3e7c8c");
    g.fillStyle = grd; g.fillRect(0, 0, 320, 180);
    g.fillStyle = "rgba(216,195,165,.18)";
    for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(40 + i * 70, 170, 50 + (i % 2) * 20, Math.PI, 0); g.fill(); }
    g.fillStyle = "#D8C3A5"; g.font = "700 13px ui-monospace,Consolas,monospace"; g.fillText(cv.dataset.week, 16, 26);
    g.fillStyle = "#fff"; g.font = "700 18px " + getComputedStyle(document.body).fontFamily;
    const words = cv.dataset.title; let line = "", y = 128;
    const lines = [];
    for (const ch of words) { if (g.measureText(line + ch).width > 220) { lines.push(line); line = ""; } line += ch; }
    lines.push(line);
    lines.slice(0, 2).forEach((l, i) => g.fillText(l, 16, y + i * 24 - (lines.length > 1 ? 12 : 0)));
    g.fillStyle = "rgba(255,255,255,.92)"; g.beginPath(); g.arc(270, 60, 26, 0, 7); g.fill();
    g.fillStyle = "#004030"; g.beginPath(); g.moveTo(262, 47); g.lineTo(262, 73); g.lineTo(284, 60); g.closePath(); g.fill();
  }

  /* ---------- 細項縮圖：160² 離屏渲染 ---------- */
  let thumbR = null, thumbScene = null, thumbCam = null;
  const thumbCache = new Map();
  function ensureThumb() {
    if (thumbR) return;
    thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    thumbR.setPixelRatio(2); thumbR.setSize(160, 160, false);
    thumbR.outputColorSpace = THREE.SRGBColorSpace; thumbR.toneMapping = THREE.ACESFilmicToneMapping;
    thumbScene = new THREE.Scene();
    thumbScene.add(new THREE.HemisphereLight(0xffffff, 0x8f8270, 1.6));
    const d = new THREE.DirectionalLight(0xfff3e0, 2.2); d.position.set(2, 4, 3); thumbScene.add(d);
    thumbCam = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
    thumbCam.position.set(1.7, 1.6, 2.3); thumbCam.lookAt(0, 0.42, 0);
  }
  function drawThumb(cv, it) {
    try {
      ensureThumb();
      if (!thumbCache.has(it.model)) {
        captureParts = [];
        MODELS[it.model](new THREE.Matrix4());
        const grp = new THREE.Group();
        captureParts.forEach(({ kind, m, color }) => {
          const mesh = new THREE.Mesh(GEO[kind], new THREE.MeshStandardMaterial({ color, roughness: 0.78 }));
          mesh.applyMatrix4(m);
          grp.add(mesh);
        });
        captureParts = null;
        thumbCache.set(it.model, grp);
      }
      thumbScene.children.filter((c) => c.isGroup).forEach((c) => thumbScene.remove(c));
      thumbScene.add(thumbCache.get(it.model));
      thumbR.render(thumbScene, thumbCam);
      cv.getContext("2d").drawImage(thumbR.domElement, 0, 0, cv.width, cv.height);
    } catch (err) { console.warn(err); cv.remove(); }
  }

  /* ---------- 學生模式與登入閘門（密碼只比對 SHA-256 雜湊值） ---------- */
  const gateEl = document.getElementById("gate"), gErr = document.getElementById("gErr");
  function renderAuth() {

  async function sha256(text) {
    if (!(window.crypto && crypto.subtle)) throw new Error("no-subtle");
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));

  /* ---------- 合成配樂（Web Audio，預設關閉，不載入任何音檔） ---------- */
  // 不再使用持續的低音墊底：改為間歇淡入淡出的柔和和弦（像呼吸），整體音域偏高並濾掉低頻；
  // 風聲只在高處區塊（wind ≥ 0.5）出現；清晨、白天、黃昏、夜晚各有不同的旋律密度、音色與環境音。
  const SCALES = { major: [0, 2, 4, 7, 9], minor: [0, 3, 5, 7, 10] };
  const midiHz = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const arng = mulberry32(31); // 配樂專用亂數，不影響場景
  const audio = { ctx: null, on: false, master: null, bus: null, windGain: null, zone: null, cfg: null, nextNote: 0, nextAmb: 0, nextSwell: 0 };
  // 時段設定：gap = 旋律間隔倍數、gain = 旋律音量、lift = 音域位移、wave = 音色、
  // birds = 鳥鳴間隔 [最短, 最長]（null 為不出現）、crickets = 蟲鳴間隔、swell = 和弦音量
  const PHASES = {
    dawn:  { gap: 1.6, gain: 0.05,  lift: 0,   wave: "sine",     birds: [0.9, 2.2], crickets: null,       swell: 0.022 },
    day:   { gap: 1.0, gain: 0.065, lift: 0,   wave: null,       birds: [2.5, 6],   crickets: null,       swell: 0.026 },
    dusk:  { gap: 1.4, gain: 0.055, lift: -5,  wave: "triangle", birds: [6, 11],    crickets: [4, 8],     swell: 0.026 },
    night: { gap: 2.2, gain: 0.04,  lift: -5,  wave: "sine",     birds: null,       crickets: [0.8, 2.2], swell: 0.018 }
  };
  function currentPhase() {
    const m = ((minutes % 1440) + 1440) % 1440;
    if (m >= 330 && m < 480) return "dawn";
    if (m >= 480 && m < 1020) return "day";
    if (m >= 1020 && m < 1200) return "dusk";
    return "night";
  }
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = new AC();
    audio.ctx = ctx;
    audio.master = ctx.createGain(); audio.master.gain.value = 0;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 160; hp.Q.value = 0.5; // 濾掉低頻，避免嗡嗡聲
    audio.master.connect(hp); hp.connect(ctx.destination);
    audio.bus = audio.master;
    // 風聲（只在高處區塊）：濾波後的雜訊，頻帶緩慢飄移
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = arng() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 700; bp.Q.value = 0.8;
    audio.windGain = ctx.createGain(); audio.windGain.gain.value = 0;
    src.connect(bp); bp.connect(audio.windGain); audio.windGain.connect(audio.master); src.start();
    const wl = ctx.createOscillator(), wlg = ctx.createGain();
    wl.frequency.value = 0.09; wlg.gain.value = 260; wl.connect(wlg); wlg.connect(bp.frequency); wl.start();
    return true;
  }
  function soundZone(zid) {
    const cfg = DATA.sound[zid];
    if (!cfg || !audio.ctx) return;
    audio.zone = zid; audio.cfg = cfg;
    audio.windGain.gain.setTargetAtTime(cfg.wind >= 0.5 ? cfg.wind * 0.03 : 0, audio.ctx.currentTime, 1.5);
    audio.nextSwell = Math.min(audio.nextSwell, audio.ctx.currentTime + 0.5); // 換區時很快以新調性淡入一個和弦
  }
  function tone(freq, start, dur, peak, type, attack = 0.012) {
    const ctx = audio.ctx, o = ctx.createOscillator(), g = ctx.createGain();

  function swell(cfg, ph, t) {

    [0, 7, 12 + third].forEach((iv) => tone(midiHz(cfg.root + iv + ph.lift), t, 7.5, ph.swell, "sine", 2.6));
  }

    const n = 2 + Math.floor(arng() * 3), base = 2600 + arng() * 1200;
    for (let k = 0; k < n; k++) {

  const between = ([lo, hi]) => lo + arng() * (hi - lo);
  function updateSound() {
    if (!audio.on || !audio.ctx || audio.ctx.state !== "running") return;
    // 目前所在區塊：選取的區塊，否則取鏡頭目標最近的區塊
    let zid = selectedZone;
    if (!zid) {
      let best = Infinity;
      terraces.forEach((t) => { const d = Math.hypot(t.center.x - controls.target.x, t.center.z - controls.target.z); if (d < best) { best = d; zid = t.zone.id; } });
    }
    if (zid !== audio.zone) soundZone(zid);
    const now = audio.ctx.currentTime, cfg = audio.cfg, ph = PHASES[currentPhase()];
    if (now >= audio.nextSwell) { swell(cfg, ph, now + 0.05); audio.nextSwell = now + 9 + arng() * 7; }

  }
  const soundBtn = document.getElementById("soundBtn");
  function setSound(on) {
