    audio.on = on;
    soundBtn.setAttribute("aria-pressed", String(on));
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime;
    if (on) { audio.ctx.resume(); audio.zone = null; audio.master.gain.setTargetAtTime(0.7, t, 0.6); }
    else audio.master.gain.setTargetAtTime(0, t, 0.25);
  }
  soundBtn.addEventListener("click", () => setSound(!audio.on));
  document.addEventListener("visibilitychange", () => {
    if (!audio.ctx) return;
    if (document.hidden) audio.ctx.suspend(); else if (audio.on) audio.ctx.resume();
  });

  /* ---------- 手機版：HUD 收進「時間」按鈕 ---------- */
  const hudEl = document.getElementById("hud");
  document.getElementById("timeBtn").addEventListener("click", () => {
    const open = !hudEl.classList.contains("expanded");
    hudEl.classList.toggle("expanded", open);
    document.getElementById("timeBtn").setAttribute("aria-expanded", String(open));
  });

  /* ---------- 手機版：底部面板拖曳調整高度 ---------- */
  document.querySelectorAll(".sheet-handle").forEach((hd) => {
    const panel = hd.parentElement;
    let startY = 0, startH = 0, dragging = false;
    hd.setAttribute("title", tr("dragHandle"));
    hd.addEventListener("pointerdown", (e) => {
      dragging = true; startY = e.clientY; startH = panel.getBoundingClientRect().height;
      hd.setPointerCapture(e.pointerId);
    });
    hd.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const h = THREE.MathUtils.clamp(startH + (startY - e.clientY), 80, window.innerHeight * 0.92);
      panel.style.height = h + "px";
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      const h = panel.getBoundingClientRect().height, vh = window.innerHeight;
      if (h < vh * 0.18) {
        panel.style.height = "";
        if (hd.dataset.sheet === "card") closeCard(); else setSidebar(false);
        return;
      }
      const base = hd.dataset.sheet === "card" ? 0.34 : 0.52;
      panel.style.height = (h > vh * 0.7 ? vh * 0.92 : vh * base) + "px"; // 吸附到預設高度或全螢幕
    };
    hd.addEventListener("pointerup", end);
    hd.addEventListener("pointercancel", end);
  });

  /* ---------- 鍵盤：方向鍵轉動鏡頭，Esc 關閉 ---------- */
  const _sph = new THREE.Spherical(), _off = new THREE.Vector3();
  function nudgeCamera(dTheta, dPhi) {
    _off.copy(camera.position).sub(controls.target);
    _sph.setFromVector3(_off);
    _sph.theta += dTheta;
    _sph.phi = THREE.MathUtils.clamp(_sph.phi + dPhi, controls.minPolarAngle, controls.maxPolarAngle);
    _off.setFromSpherical(_sph);
    camera.position.copy(controls.target).add(_off);
    flight = null;
    controls.update();
    dirty = true;
  }
  window.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
    if (e.key === "Escape") {
      if (!helpEl.hidden) return closeHelp();
      if (!gateEl.hidden) return closeGate();
      if (tour.on) endTour();
      if (sel.type) closeCard();
      goOverview();
      return;
    }
    if (typing) return;
    if (e.key === "ArrowLeft") { nudgeCamera(0.08, 0); e.preventDefault(); }
    else if (e.key === "ArrowRight") { nudgeCamera(-0.08, 0); e.preventDefault(); }
    else if (e.key === "ArrowUp") { nudgeCamera(0, -0.05); e.preventDefault(); }
    else if (e.key === "ArrowDown") { nudgeCamera(0, 0.05); e.preventDefault(); }
    else if ((e.key === "f" || e.key === "F") && demoMode) {
      if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {});
    }
  });

  /* ---------- ?demo=1 簡報模式 ---------- */
  const demoMode = qs.get("demo") === "1";
  if (demoMode) {
    document.body.classList.add("demo");
    const hint = document.getElementById("demoHint");
    hint.hidden = false;
    setTimeout(() => { hint.style.opacity = "0"; setTimeout(() => { hint.hidden = true; }, 1000); }, 4000);
    setTimeout(() => startTour(true), 600);
    // 瀏覽器要求先有使用者操作才能出聲：簡報時第一次點擊畫面就開啟配樂
    document.addEventListener("pointerdown", () => { if (!audio.on) setSound(true); }, { once: true });
  } else if (!store.get("onboarded")) {
    openHelp();
  }

  /* ---------- 日夜循環 ---------- */
  const KF = DATA.dayCycle.keyframes.map((k) => ({
    m: k[0], top: new THREE.Color("#" + k[1]), hor: new THREE.Color("#" + k[2]), sun: new THREE.Color("#" + k[3]), sunI: k[4],
    hs: new THREE.Color("#" + k[5]), hg: new THREE.Color("#" + k[6]), hI: k[7], night: k[8]
  }));
  const tmp = { top: new THREE.Color(), hor: new THREE.Color(), sun: new THREE.Color(), hs: new THREE.Color(), hg: new THREE.Color() };
  let minutes = DATA.dayCycle.startMinute;
  let paused = false;
  let lastApplied = -1;
  let night = 0;

  function applyDayCycle(min) {
    const m = ((min % 1440) + 1440) % 1440;
    let k = 0;
    while (k < KF.length - 2 && m >= KF[k + 1].m) k++;
    const A = KF[k], B = KF[k + 1];
    const t = (m - A.m) / (B.m - A.m);
    for (const key of ["top", "hor", "sun", "hs", "hg"]) tmp[key].copy(A[key]).lerp(B[key], t);
    const sunI = THREE.MathUtils.lerp(A.sunI, B.sunI, t);
    const hI = THREE.MathUtils.lerp(A.hI, B.hI, t);
    night = THREE.MathUtils.lerp(A.night, B.night, t);

    skyUniforms.uTop.value.copy(tmp.top);
    skyUniforms.uHorizon.value.copy(tmp.hor);
    skyUniforms.uSun.value.copy(tmp.sun);
    skyUniforms.uNight.value = night;
    scene.fog.color.copy(tmp.hor);
    hemi.color.copy(tmp.hs); hemi.groundColor.copy(tmp.hg); hemi.intensity = hI;
    sun.color.copy(tmp.sun); sun.intensity = sunI;
    waterUniforms.uNight.value = night;
    glowMat.emissiveIntensity = night * 3.2; // 窗戶、路燈、串燈只在夜晚發光
    ridges.forEach((r) => r.mat.color.copy(r.base).lerp(tmp.hor, r.k).multiplyScalar(1 - night * 0.35));

    // 太陽方位（時間量化到 10 分鐘），永遠在鏡頭這一側的上方
    const q = Math.round(m / 10) * 10;
    const tt = THREE.MathUtils.clamp((q - 360) / 720, 0, 1);
    const az = Math.PI * (0.15 + 0.7 * tt);
    const el = 0.35 + Math.sin(tt * Math.PI) * 0.75;
    const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), 0.55 * Math.cos(el) + 0.35).normalize();
    sun.position.copy(cityCenter).addScaledVector(dir, 40);
    sun.target.position.copy(cityCenter);
    skyUniforms.uSunDir.value.copy(dir);
  }

  const clockEl = document.getElementById("clock");
  const presetWrap = document.getElementById("presetBtns");
  function renderPresets() {
    presetWrap.innerHTML = "";
    DATA.dayCycle.presets.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = pick(p.label);
      b.addEventListener("click", () => { minutes = p.minute; lastApplied = -1; dirty = true; });
      presetWrap.appendChild(b);
    });
  }
  renderPresets();
  const pauseBtn = document.getElementById("pauseBtn");
  function renderPause() {
    pauseBtn.textContent = paused ? tr("resume") : tr("pause");
    pauseBtn.setAttribute("aria-pressed", String(paused));
  }
  pauseBtn.addEventListener("click", () => { paused = !paused; renderPause(); dirty = true; });
  renderPause();

  /* ---------- 語言切換 ---------- */
  document.getElementById("langBtn").addEventListener("click", () => setLang(lang === "zh" ? "en" : "zh"));
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
  function setLang(next) {
    if (next === lang && !bilingual) return;
    lang = next;
    bilingual = false; // 手動切換語言時結束中英並列
    try { localStorage.setItem("pst.lang", JSON.stringify(lang)); } catch { /* 忽略 */ }
    const url = new URL(location.href);
    if (lang === "en") url.searchParams.set("lang", "en"); else url.searchParams.delete("lang");
    history.replaceState(null, "", url);
    applyStaticI18n();
    renderLabels(); renderPresets(); renderPause(); renderWalkerTags(); renderNamesBtn();
    renderAuth(); renderDiaryFilter(); renderSidebar();
    if (!diaryEl.hidden) renderDiary();
    if (sel.type) renderCard();
    if (tour.on) renderTour();
    if (!helpEl.hidden) setHelpTab(helpTab);
    searchBox.placeholder = tr("search");
    pins.forEach((p, id) => p.el.setAttribute("aria-label", pick(itemById.get(id).name)));
  }

  /* ---------- 尺寸 ---------- */
  function resize() {
    const w = app.clientWidth, h = app.clientHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile() ? 1.4 : 1.75));
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + "px";
    renderer.domElement.style.height = h + "px";
    labelRenderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    dirty = true;
  }
  new ResizeObserver(resize).observe(app);

  /* ---------- reduced-motion ---------- */
  // 減少動態效果開啟時，畫面上方顯示一則說明（8 秒後收起）
  const rmNote = document.getElementById("rmNote");
  let rmTimer = 0;
  function showRmNote() {
    rmNote.hidden = false;
    clearTimeout(rmTimer);
    rmTimer = setTimeout(() => { rmNote.hidden = true; }, 8000);
  }
  if (reducedMotion) showRmNote();
  document.body.classList.toggle("reduce-motion", reducedMotion);
  motionQuery.addEventListener("change", (e) => {
    reducedMotion = e.matches || forceReduce;
    document.body.classList.toggle("reduce-motion", reducedMotion);
    if (reducedMotion) showRmNote(); else rmNote.hidden = true;
    dirty = true;
  });

  /* ---------- 迴圈 ---------- */
  const timer = new THREE.Clock();
  let elapsed = 0;
  resize();
  goOverview(true);
  applyDayCycle(minutes);

  function frame() {
    const dt = Math.min(timer.getDelta(), 0.08);
    const animate = !reducedMotion;
    if (animate && !paused) minutes = (minutes + dt * DATA.dayCycle.minutesPerSecond) % 1440;
    if (animate) { elapsed += dt; waterUniforms.uTime.value = elapsed; updateClouds(dt); }

    const shown = Math.floor(minutes);
    if (shown !== lastApplied) {
      applyDayCycle(minutes);
      lastApplied = shown;
      const hh = String(Math.floor(shown / 60)).padStart(2, "0"), mm = String(shown % 60).padStart(2, "0");
      clockEl.textContent = `${hh}:${mm}`;
      dirty = true;
    }

    if (flight) {
      const k = Math.min(1, (performance.now() - flight.start) / flight.dur);
      const e = easeInOutCubic(k);
      camera.position.lerpVectors(flight.p0, flight.p1, e);
      controls.target.lerpVectors(flight.t0, flight.t1, e);
      if (k >= 1) flight = null;
      dirty = true;
    }
    controls.update();
    sky.position.copy(camera.position);
    const camDist = camera.position.distanceTo(controls.target);
    const showSmall = camDist < 26; // 小物件 LOD
    if (kitMeshes.small[0] && kitMeshes.small[0].visible !== showSmall) { kitMeshes.small.forEach((m) => { m.visible = showSmall; }); dirty = true; }
    updateWalkers(dt, animate, camDist);
    updateTour();
    updateSound();
    const compact = window.innerWidth <= 800 && camDist > 26;
    if (compact !== document.body.classList.contains("compact-labels")) document.body.classList.toggle("compact-labels", compact);

    if (dirty || animate) {
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      avoidPanels();
      dirty = false;
    }
    requestAnimationFrame(frame);
  }
  // 第一幀同步繪製後就移除載入畫面（不依賴 rAF，背景分頁也能正確完成）
  frame();
  const loadingEl = document.getElementById("loading");
  loadingEl.classList.add("hide");
  setTimeout(() => { loadingEl.style.display = "none"; }, 700);
} catch (err) {
  showError(err);
}
</script>
</body>
</html>
